<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umar Iltaf - Official Partner Program</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;box-sizing:border-box}
body{margin:0;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:15px}
.card{width:100%;max-width:440px;background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.1);overflow:hidden;border:1px solid #e2e8f0}
.top{padding:28px 28px 0 28px;text-align:center}
.logo{width:56px;height:56px;background:#111827;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto}
.badge{margin-top:12px;display:inline-flex;gap:6px;align-items:center;background:#ecfdf5;color:#065f46;padding:6px 12px;border-radius:100px;font-size:12px;font-weight:600}
.body{padding:28px}
h1{font-size:22px;margin:12px 0 6px 0}
.sub{color:#64748b;font-size:14px;margin-bottom:20px;line-height:1.5}
label{font-size:13px;font-weight:600;color:#334155;display:block;margin-top:14px;margin-bottom:6px}
input,select{width:100%;padding:13px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;outline:none;transition:.2s}
input:focus{border-color:#111827}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:700;font-size:15px;margin-top:22px;cursor:pointer}
.btn:active{transform:scale(.98)}
.trust{display:flex;gap:12px;margin-top:18px;padding-top:18px;border-top:1px solid #f1f5f9}
.trust div{flex:1;text-align:center;font-size:11px;color:#64748b}
.trust b{display:block;font-size:14px;color:#111827;margin-bottom:2px}
.foot{text-align:center;font-size:12px;color:#94a3b8;padding:0 28px 22px 28px}
.link{color:#2563eb;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="card">
<div class="top">
<div class="logo">U</div>
<div class="badge">✓ Verified Official Store</div>
<h1>Partner Program</h1>
<div class="sub">Umar Iltaf Official Affiliate & Vendor Network.<br>Join 2,400+ partners earning daily.</div>
</div>
<div class="body">
<label>Full Name</label>
<input id="name" placeholder="e.g. Ali Khan">

<label>Mobile / Partner ID</label>
<input id="phone" placeholder="03XX-XXXXXXX">

<label>Password</label>
<input id="pass" type="password" placeholder="Minimum 6 characters">

<label>I want to join as</label>
<select id="role">
<option value="affiliate">Affiliate Partner - Earn Commission</option>
<option value="vendor">Vendor Partner - Sell Products</option>
</select>

<button class="btn" onclick="doSignup()">Create Partner Account →</button>

<div class="trust">
<div><b>2,400+</b>Partners</div>
<div><b>Rs.50</b>Avg. Commission</div>
<div><b>24/7</b>Payout Support</div>
</div>

<div style="text-align:center;margin-top:16px;font-size:13px;color:#64748b">Already have account? <span class="link" onclick="doLoginDirect()">Login</span></div>
</div>
<div class="foot">🔒 Secured by Umar Iltaf Store • 03105423365 • Peshawar, PK</div>
</div>

<script>
function doSignup(){
let n=document.getElementById('name').value.trim();
let p=document.getElementById('phone').value.trim();
let ps=document.getElementById('pass').value.trim();
let r=document.getElementById('role').value;
if(!n||!p||ps.length<4){alert('Please fill all fields correctly');return;}
let users=JSON.parse(localStorage.getItem('users')||'{}');
users[p]={name:n,pass:ps,role:r,verified:true,date:new Date().toLocaleDateString()};
localStorage.setItem('users',JSON.stringify(users));
localStorage.setItem('current_user',p);
localStorage.setItem('current_role',r);
// Owner notification
let msg=`*NEW PARTNER SIGNUP*%0AName: ${n}%0APhone: ${p}%0ARole: ${r}%0A%0AVerified Official`;
window.open(`https://wa.me/923105423365?text=${msg}`,'_blank');
setTimeout(()=>{ window.location.href=r==='affiliate'?'affiliate.html?ref='+p:'vendor.html'; },800);
}
function doLoginDirect(){
let id=prompt('Enter your Partner ID / Phone');
if(id){localStorage.setItem('current_user',id);window.location.href='affiliate.html?ref='+id;}
}
</script>
</body>
</html>
